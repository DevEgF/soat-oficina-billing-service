apiVersion: v1
kind: Service
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: application
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Publicada no host como 127.0.0.1:30082 pelo kind-config.yaml da plataforma.
      nodePort: 30082
