# Configuração não sensível. Os segredos vêm do Secret billing-service-secrets (ver secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  labels:
    app.kubernetes.io/name: billing-service
data:
  SERVER_PORT: "8080"
  APP_ENVIRONMENT: "hml"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://billing-postgres:5432/billing"
  SPRING_DATASOURCE_USERNAME: "billing"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "oficina"
  # Adaptador da porta PaymentGateway. Hoje só existe "simulated" (aprova na hora); o do
  # Mercado Pago entra depois e usa MERCADOPAGO_ACCESS_TOKEN do Secret.
  APP_PAYMENT_GATEWAY: "simulated"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "logstash"
  # Agente Java do New Relic: só liga se NEW_RELIC_LICENSE_KEY (Secret) não estiver vazio.
  NEW_RELIC_APP_NAME: "oficina-billing-service"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
  NEW_RELIC_ATTRIBUTES_EXCLUDE: "request.parameters.*,request.headers.*,response.headers.*,cpf,authorization,password"
  NEW_RELIC_TRANSACTION_TRACER_RECORD_SQL: "off"
  NEW_RELIC_LABELS: "environment:hml;service:billing-service"
