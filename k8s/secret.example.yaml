# SÓ DOCUMENTAÇÃO: fora do kustomization.yaml e sem valores reais.
# O Secret de verdade é criado por soat-oficina-infra-k8s/local/secrets.sh a partir do .env.local.
#
# SPRING_DATASOURCE_PASSWORD também inicializa o PostgreSQL do serviço (k8s/postgres.yaml).
# NEW_RELIC_LICENSE_KEY vazio desliga o agente do New Relic.
# MERCADOPAGO_* são exigidas com APP_PAYMENT_GATEWAY=mercadopago (ConfigMap): credenciais da conta
# de teste do Mercado Pago e dados do cartão de teste do provedor. Com "simulated" ficam sem uso.
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: oficina
type: Opaque
stringData:
  APP_JWT_SECRET: "CHANGE_ME_min_32_bytes_openssl_rand_hex_32"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_db_password"
  SPRING_RABBITMQ_PASSWORD: "CHANGE_ME_rabbitmq_password"
  NEW_RELIC_LICENSE_KEY: ""
  MERCADOPAGO_ACCESS_TOKEN: "CHANGE_ME_mercadopago_test_access_token"
  MERCADOPAGO_PUBLIC_KEY: "CHANGE_ME_mercadopago_test_public_key"
  MERCADOPAGO_TEST_CARD_NUMBER: "CHANGE_ME_test_card_number"
  MERCADOPAGO_TEST_CARD_SECURITY_CODE: "CHANGE_ME_test_card_cvv"
  MERCADOPAGO_TEST_CARD_EXPIRATION_MONTH: "CHANGE_ME_mm"
  MERCADOPAGO_TEST_CARD_EXPIRATION_YEAR: "CHANGE_ME_yyyy"
  MERCADOPAGO_TEST_CARD_HOLDER_DOCUMENT: "CHANGE_ME_cpf_do_titular"
