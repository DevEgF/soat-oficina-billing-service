spring.application.name=billing-service
server.port=${SERVER_PORT:8082}

# Required: no defaults outside the local/test profiles (see application-local.properties).
# Passwords follow the same rule: they come from the environment, never from this file.
app.environment=${APP_ENVIRONMENT}
app.jwt.secret=${APP_JWT_SECRET}

# PaymentGateway adapter: "simulated" (default; APRO approves, CONT stays pending, other names are
# rejected) or "mercadopago" (Orders API, test environment). Any other value leaves no gateway bean
# and the service does not start.
app.payment.gateway=${APP_PAYMENT_GATEWAY:simulated}
# Cardholder name used when the approval does not send payment.cardholderName.
app.payment.default-cardholder-name=${APP_PAYMENT_DEFAULT_CARDHOLDER_NAME:APRO}
# Periodic check of PENDING payments at the provider (ISO-8601 duration).
app.payment.status-check-interval=${APP_PAYMENT_STATUS_CHECK_INTERVAL:PT10S}

# Mercado Pago. Credentials and test card come from the environment (Secret in the cluster) and are
# required only with app.payment.gateway=mercadopago.
app.mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
app.mercadopago.test-card.number=${MERCADOPAGO_TEST_CARD_NUMBER:}
app.mercadopago.test-card.security-code=${MERCADOPAGO_TEST_CARD_SECURITY_CODE:}
app.mercadopago.test-card.expiration-month=${MERCADOPAGO_TEST_CARD_EXPIRATION_MONTH:}
app.mercadopago.test-card.expiration-year=${MERCADOPAGO_TEST_CARD_EXPIRATION_YEAR:}
app.mercadopago.test-card.holder-document=${MERCADOPAGO_TEST_CARD_HOLDER_DOCUMENT:}
# Test user e-mail of the payer (...@testuser.com); blank uses the customer e-mail.
app.mercadopago.payer-email=${MERCADOPAGO_PAYER_EMAIL:}
app.mercadopago.connect-timeout=5s
app.mercadopago.read-timeout=20s

# PostgreSQL of this service. Defaults match postgres-billing in the platform docker-compose.yml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/billing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:billing}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# The database may still be starting when the pod starts (first deploy).
spring.flyway.connect-retries=20

# RabbitMQ of the platform (Service rabbitmq in the cluster, docker-compose locally).
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:oficina}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=/

# Saga consumers: 3 attempts in total (1 + 2 retries) starting at 500 ms, then rejected without
# requeue, which dead-letters the message to <queue>.dlq. Invalid messages skip the retries
# (ListenerRetryConfiguration).
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s

# Actuator: only health, with Kubernetes probes. Readiness proves database and broker connectivity.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
